services:
  hec-golf:
    build: .
    container_name: hec-golf-league
    restart: unless-stopped
    ports:
      - "3002:3000"        # Access at http://your-lab-ip:3002
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data   # SQLite database persists here on the host

# ── Deploy workflow ───────────────────────────────────────────────────────────
#
#   Local and server both use data/dev.db — same path, same name.
#
#   Weekly update (after running scrapers locally):
#        scp data/dev.db user@server:/root/HecGolfLeague/data/dev.db
#        ssh user@server "chown 1001:1001 /root/HecGolfLeague/data/dev.db && docker compose restart hec-golf"
#
#   First-time setup on server:
#        mkdir -p data
#        scp data/dev.db user@server:/root/HecGolfLeague/data/dev.db
#        chown 1001:1001 data/dev.db
#        echo 'ANTHROPIC_API_KEY="sk-ant-..."' > .env
#        docker compose up -d --build
